openapi: 3.0.3
info:
  title: MarketIQ Fulfillment API
  version: 1.0.0

tags:
  - name: Fulfillment
    description: Seller order fulfillment and shipping

paths:
  /api/seller/orders/{id}/fulfillments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Fulfillment]
      summary: List fulfillments for a seller order
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fulfillments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Fulfillment]
      summary: Create a fulfillment for a seller order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [LOCAL, IMPORT, PREORDER, DIGITAL]
                warehouseId: { type: string, nullable: true }
                shippingMethod:
                  type: string
                  enum: [LOCAL, IMPORT, SEA, AIR, DIGITAL]
                  nullable: true
                estimatedDelivery:
                  type: string
                  format: date-time
                  nullable: true
                shippingCost: { type: number, minimum: 0 }
                trackingNumber: { type: string }
                carrier: { type: string }
                trackingUrl: { type: string, format: uri }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/seller/fulfillments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Fulfillment]
      summary: Get a fulfillment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fulfillment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Fulfillment]
      summary: Update a fulfillment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PROCESSING, SHIPPED, DELIVERED, CANCELLED]
                trackingNumber: { type: string }
                carrier: { type: string }
                trackingUrl: { type: string, format: uri }
                shippingMethod:
                  type: string
                  enum: [LOCAL, IMPORT, SEA, AIR, DIGITAL]
                estimatedDelivery:
                  type: string
                  format: date-time
                shippingCost: { type: number, minimum: 0 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }