openapi: 3.0.3
info:
  title: Product API
  version: 1.0.0
  description: Public product catalog and seller-owned product endpoints

tags:
  - name: Products
    description: Public product catalog and seller-owned products

paths:
  /api/products:
    get:
      tags: [Products]
      summary: List public products (ACTIVE sellers only)
      security: []
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: brandId
          schema: { type: string }
        - in: query
          name: collectionId
          schema: { type: string }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get a public product
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail with variants and media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/seller/products:
    get:
      tags: [Products]
      summary: List products owned by the authenticated seller
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - $ref: "#/components/parameters/SearchParam"
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: brandId
          schema: { type: string }
        - in: query
          name: collectionId
          schema: { type: string }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated seller products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    post:
      tags: [Products]
      summary: Create a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, categoryId]
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                brandId: { type: string, nullable: true }
                categoryId: { type: string }
                collectionId: { type: string, nullable: true }
                isFeatured: { type: boolean }
                isNew: { type: boolean }
                isBestSeller: { type: boolean }
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
                metadata:
                  type: string
                  description: JSON-encoded string
                coverImage:
                  type: string
                  format: binary
                galleryImages:
                  type: array
                  items:
                    type: string
                    format: binary
          application/json:
            schema:
              type: object
              required: [name, categoryId]
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                brandId: { type: string, nullable: true }
                categoryId: { type: string }
                collectionId: { type: string, nullable: true }
                isFeatured: { type: boolean }
                isNew: { type: boolean }
                isBestSeller: { type: boolean }
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
                metadata: {}
                coverImage:
                  $ref: "#/components/schemas/MediaAssetInput"
                galleryImages:
                  type: array
                  items:
                    $ref: "#/components/schemas/MediaAssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/seller/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }

    get:
      tags: [Products]
      summary: Get a seller-owned product
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    patch:
      tags: [Products]
      summary: Update a seller-owned product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                brandId: { type: string, nullable: true }
                categoryId: { type: string }
                collectionId: { type: string, nullable: true }
                isFeatured: { type: boolean }
                isNew: { type: boolean }
                isBestSeller: { type: boolean }
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
                coverImage:
                  type: string
                  format: binary
                galleryImages:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    delete:
      tags: [Products]
      summary: Archive a seller-owned product
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }