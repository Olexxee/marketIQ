openapi: 3.0.3
info:
  title: Variant API
  version: 1.0.0
  description: Product variant operations.

tags:
  - name: Variants
    description: Product variants (SKUs)

paths:
  /api/products/{productId}/variants:
    get:
      tags: [Variants]
      summary: List public variants of a product
      security: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/seller/products/{productId}/variants:
    parameters:
      - in: path
        name: productId
        required: true
        schema: { type: string }

    get:
      tags: [Variants]
      summary: List all variants of a seller-owned product
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    post:
      tags: [Variants]
      summary: Create a variant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [price]
              properties:
                sku: { type: string }
                name: { type: string }
                color: { type: string }
                size: { type: string }
                price: { type: number }
                compareAtPrice: { type: number, nullable: true }
                weight: { type: number }
                length: { type: number, nullable: true }
                width: { type: number, nullable: true }
                height: { type: number, nullable: true }
                fulfillmentType:
                  type: string
                  enum: [LOCAL, IMPORT, PREORDER, DIGITAL]
                attributes:
                  type: string
                  description: JSON-encoded string
                metadata:
                  type: string
                  description: JSON-encoded string
                isActive: { type: boolean }
                variantImages:
                  type: array
                  items:
                    type: string
                    format: binary
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                sku: { type: string }
                name: { type: string }
                color: { type: string }
                size: { type: string }
                price: { type: number }
                compareAtPrice: { type: number, nullable: true }
                weight: { type: number }
                fulfillmentType:
                  type: string
                  enum: [LOCAL, IMPORT, PREORDER, DIGITAL]
                attributes: {}
                metadata: {}
                isActive: { type: boolean }
                variantImages:
                  type: array
                  items:
                    $ref: "#/components/schemas/MediaAssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/seller/variants/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }

    get:
      tags: [Variants]
      summary: Get a variant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Variant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    patch:
      tags: [Variants]
      summary: Update a variant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                sku: { type: string }
                name: { type: string }
                color: { type: string }
                size: { type: string }
                price: { type: number }
                compareAtPrice: { type: number, nullable: true }
                weight: { type: number }
                fulfillmentType:
                  type: string
                  enum: [LOCAL, IMPORT, PREORDER, DIGITAL]
                isActive: { type: boolean }
                variantImages:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    delete:
      tags: [Variants]
      summary: Deactivate a variant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }