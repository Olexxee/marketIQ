name: Backend checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feat/auth-authorization-contract]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/marketiq_test
      JWT_ACCESS_SECRET: test-access-secret-with-sufficient-length
      JWT_REFRESH_SECRET: test-refresh-secret-with-sufficient-length
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm test
